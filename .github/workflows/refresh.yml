name: Refresh dataset atlas

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Incremental update (new/changed datasets only)
        working-directory: pipeline
        run: python update.py --mode llm
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Build site data
        working-directory: pipeline
        run: python build.py

      - name: Commit data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/state/datasets.json space/data/datasets.json
          git diff --cached --quiet || git commit -m "chore: daily dataset atlas refresh"
          git push

      - name: Publish to HF Space
        run: |
          pip install -U "huggingface_hub[cli]"
          hf upload ravediamond/lerobot-dataset-atlas space/data/datasets.json data/datasets.json --repo-type space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
