name: Refresh dataset atlas

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: |
          pip install -r pipeline/requirements.txt
          pip install -U "huggingface_hub[cli]"

      - name: Pull pipeline state (too large for git — lives in a private HF dataset repo)
        run: |
          mkdir -p pipeline/state
          hf download ravediamond/lerobot-dataset-atlas-state datasets.json --repo-type dataset --local-dir pipeline/state
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Incremental update (new/changed datasets only)
        working-directory: pipeline
        run: python update.py --mode gemini
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build site data
        working-directory: pipeline
        run: python build.py

      - name: Push updated state back to HF
        run: hf upload ravediamond/lerobot-dataset-atlas-state pipeline/state/datasets.json datasets.json --repo-type dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Commit site data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add space/data/datasets.json
          git diff --cached --quiet || git commit -m "chore: daily dataset atlas refresh"
          git push

      - name: Publish to HF Space
        run: hf upload ravediamond/lerobot-dataset-atlas space/data/datasets.json data/datasets.json --repo-type space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
